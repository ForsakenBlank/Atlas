name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a version release (v + atlas.versionName, notes from CHANGELOG.md)"
        type: boolean
        default: false
      cleanup:
        description: "Delete every release that is not a version (old branch builds and 'latest build')"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee build.log

      # compile errors as annotations, so they show on the run's summary page
      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: " build.log | head -40 | sed 's/^e: /::error::/' || true

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk atlas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-apk
          path: atlas.apk

      # the apk is uploaded first so a failing test never hides a build you can try
      - name: Run unit tests
        run: ./gradlew :shared:desktopTest :app:testDebugUnitTest

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/

  # the pc versions are built on the system they run on, java packs its own runtime for each
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app folder
        shell: bash
        run: ./gradlew :desktop:createDistributable

      - name: Pack for Linux
        if: matrix.name == 'linux'
        run: |
          cp desktop/linux/install.sh desktop/build/compose/binaries/main/app/Atlas/
          tar -czf Atlas-linux-x64.tar.gz -C desktop/build/compose/binaries/main/app Atlas

      - name: Pack for Windows
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/Atlas -DestinationPath Atlas-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.name }}
          path: Atlas-*

  # every branch gets a release page so the builds can be installed straight from a phone or pc,
  # artifact downloads need a github login and come out as a zip
  # only a version release goes on the releases page; every other build stays a downloadable artifact on its
  # run, so the page (and the in-app updater) only ever sees real versions
  publish:
    needs: [android, desktop]
    if: ${{ !cancelled() && needs.android.result == 'success' && inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-*
          merge-multiple: true

      # Actions -> Build -> Run workflow with "Publish a version release" ticked
      - name: Publish the version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^atlas.versionName=//p' gradle.properties)
          # the notes are this version's part of CHANGELOG.md
          awk -v v="## $version" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          shopt -s nullglob
          files=(atlas.apk Atlas-*)
          gh release create "v$version" "${files[@]}" --target "$GITHUB_SHA" --title "Atlas $version" \
            --notes-file notes.md --latest

  # Actions -> Build -> Run workflow with "Delete every release that is not a version" ticked
  cleanup:
    if: ${{ inputs.cleanup }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the branch builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            case "$tag" in
              v[0-9]*) echo "keeping $tag" ;;
              *) echo "deleting $tag"; gh release delete "$tag" --yes --cleanup-tag ;;
            esac
          done
